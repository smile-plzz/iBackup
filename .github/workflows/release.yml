name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore iBackup.sln

      - name: Test
        run: dotnet test src/iBackup.Core.Tests/iBackup.Core.Tests.csproj -c Release --no-restore

      - name: Validate XAML layout tracks
        shell: pwsh
        run: ./scripts/Test-XamlLayout.ps1

      - name: Publish portable app
        run: dotnet publish src/iBackup.App/iBackup.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true --no-restore -o artifacts/win-x64

      - name: Verify published app resources
        shell: pwsh
        run: |
          $required = @(
            'artifacts/win-x64/iBackup.pri',
            'artifacts/win-x64/App.xbf',
            'artifacts/win-x64/MainWindow.xbf',
            'artifacts/win-x64/Views/MainPage.xbf',
            'artifacts/win-x64/Views/HistoryPage.xbf',
            'artifacts/win-x64/Views/SettingsPage.xbf'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            throw "Published app is missing required WinUI resources: $($missing -join ', ')"
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/iBackup-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: iBackup-win-x64
          path: artifacts/iBackup-win-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: artifacts/iBackup-win-x64.zip
